name: Verify zero warnings

on:
  push:
    branches:
      - fix/v1-eslint-zero-warnings
    paths:
      - .github/workflows/verify-zero-warnings.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1-eslint-zero-warnings
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require zero ESLint warnings
        run: pnpm exec eslint packages/ apps/ --max-warnings 0

      - name: Check formatting
        run: pnpm exec prettier --check packages/ apps/ examples/

      - name: Typecheck
        run: pnpm run typecheck && pnpm run typecheck:examples

      - name: Record verified head
        shell: bash
        run: |
          printf '%s\n' "${GITHUB_SHA}" > .lint-zero-proof
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .lint-zero-proof
          git commit -m "chore: record zero-warning verification"
          git push origin HEAD:fix/v1-eslint-zero-warnings
