name: Feature request
description: Suggest an enhancement within the maintained WebGL package scope.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This repository maintains the original WebGL implementation. WebGPU, cloud/headless infrastructure, hosted-product work and next-generation backend features are out of scope here.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-line description of the enhancement.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve for the maintained WebGL package?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the solution or behavior you want.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks or compatibility impact
  - type: checkboxes
    id: maintenance
    attributes:
      label: Maintenance scope
      options:
        - label: I checked docs/MAINTENANCE.md and this request fits the public WebGL package scope.
          required: true
